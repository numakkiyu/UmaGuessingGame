<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none">
  <rect width="1200" height="640" rx="32" fill="#FFF9F2"/>
  <rect x="40" y="40" width="1120" height="560" rx="28" fill="#FFFFFF" stroke="#F0D7B8" stroke-width="2"/>
  <text x="70" y="92" fill="#8B5E34" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">赛马娘猜猜乐 架构总览</text>
  <text x="70" y="126" fill="#A17A4E" font-family="Segoe UI, Arial, sans-serif" font-size="18">前端、接口、数据、缓存与资源代理围绕同一套仓库结构组织</text>

  <rect x="70" y="170" width="300" height="160" rx="22" fill="#FFF2DC" stroke="#E9C68D"/>
  <text x="98" y="214" fill="#8B5E34" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">前端界面层</text>
  <text x="98" y="252" fill="#704E2E" font-family="Segoe UI, Arial, sans-serif" font-size="18">首页 / 单人 / 多人 / 好友房</text>
  <text x="98" y="282" fill="#704E2E" font-family="Segoe UI, Arial, sans-serif" font-size="18">搜索输入 / 结果表 / 状态卡片</text>
  <text x="98" y="312" fill="#704E2E" font-family="Segoe UI, Arial, sans-serif" font-size="18">移动端与桌面端双布局</text>

  <rect x="450" y="170" width="300" height="160" rx="22" fill="#FFE8EC" stroke="#F0B8C0"/>
  <text x="478" y="214" fill="#A14E62" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">接口与业务层</text>
  <text x="478" y="252" fill="#7C4050" font-family="Segoe UI, Arial, sans-serif" font-size="18">Game / Rooms / Matchmaking API</text>
  <text x="478" y="282" fill="#7C4050" font-family="Segoe UI, Arial, sans-serif" font-size="18">字段比较 / 房间状态 / 身份校验</text>
  <text x="478" y="312" fill="#7C4050" font-family="Segoe UI, Arial, sans-serif" font-size="18">Turnstile / Rate Limit / 分享只读</text>

  <rect x="830" y="170" width="300" height="160" rx="22" fill="#E8F4FF" stroke="#B8D8F0"/>
  <text x="858" y="214" fill="#356A9A" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">数据与缓存层</text>
  <text x="858" y="252" fill="#355B7B" font-family="Segoe UI, Arial, sans-serif" font-size="18">PostgreSQL / Drizzle ORM</text>
  <text x="858" y="282" fill="#355B7B" font-family="Segoe UI, Arial, sans-serif" font-size="18">Redis / 本地回退存储</text>
  <text x="858" y="312" fill="#355B7B" font-family="Segoe UI, Arial, sans-serif" font-size="18">题库索引 / 对局状态 / 资源台账</text>

  <rect x="140" y="398" width="920" height="150" rx="24" fill="#F7F5FF" stroke="#D8CFF5"/>
  <text x="172" y="440" fill="#6854A2" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">数据与资源生成链路</text>
  <text x="172" y="478" fill="#524280" font-family="Segoe UI, Arial, sans-serif" font-size="18">normalized/characters → 构建题库 → 生成搜索索引 → 写入数据库 → 页面查询</text>
  <text x="172" y="508" fill="#524280" font-family="Segoe UI, Arial, sans-serif" font-size="18">素材来源 → 受控回源 → 本地缓存 → 前端统一资源地址</text>

  <path d="M370 250H450" stroke="#C39C66" stroke-width="4" stroke-linecap="round"/>
  <path d="M750 250H830" stroke="#D08393" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 330V398" stroke="#8F80C3" stroke-width="4" stroke-linecap="round"/>
</svg>

