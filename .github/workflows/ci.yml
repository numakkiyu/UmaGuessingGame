name: CI

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check repository contents
        run: node web/scripts/check-repository.mjs

  go:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download the frontend build for embedding
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/spafs/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          # Propagate command failures through pipelines
          set -euo pipefail
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test ./... -count=1 -race

      - name: Coverage
        run: |
          # Propagate command failures through pipelines
          set -euo pipefail
          go test ./... -count=1 -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Vulnerability scan
        run: |
          # Propagate command failures through pipelines
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Cache the application and isolated toolchain lockfiles
          cache-dependency-path: |
            web/pnpm-lock.yaml
            web/tools/toolchain/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install isolated toolchain
        run: pnpm --dir tools/toolchain install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check the embedded SPA is not stale
        working-directory: .
        # Verify the files embedded into the Go binary match the frontend build
        run: |
          # Propagate command failures through pipelines
          set -euo pipefail
          make embed-spa
          make embed-spa-check

      - name: Check bundle size budgets
        run: pnpm run size

      - name: Share the frontend build with Go checks
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            web/tools/toolchain/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install isolated toolchain
        run: pnpm --dir tools/toolchain install --frozen-lockfile

      - name: Validate OpenAPI document and route parity
        working-directory: .
        # Check both undocumented routes and documented routes missing from the router
        run: go run ./cmd/content contract --spec api/openapi.json --routes

      - name: Regenerate API types
        run: pnpm run api:types

      - name: Fail on drift
        working-directory: .
        run: |
          # Propagate command failures through pipelines
          set -euo pipefail
          if ! git diff --exit-code -- web/src/lib/api/schema.d.ts; then
            echo "generated API types are stale; run 'make web-api-types' and commit"
            exit 1
          fi

      - name: Fail if the contract artifact is untracked
        working-directory: .
        # The public contract must be available in clean checkouts
        run: |
          # Propagate command failures through pipelines
          set -euo pipefail
          if ! git ls-files --error-unmatch api/openapi.json >/dev/null 2>&1; then
            echo "api/openapi.json is not tracked by git; the contract must be a project artifact"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: umaguessinggame:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
