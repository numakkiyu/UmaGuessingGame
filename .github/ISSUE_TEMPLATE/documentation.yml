name: Documentation improvement
description: Suggest improvements for README, guides, or contributor documentation
title: "[Docs] "
labels:
  - documentation
body:
  - type: textarea
    id: issue
    attributes:
      label: What needs to be improved
      description: Describe the unclear, missing, or outdated part of the documentation.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested update
      description: Share the wording, structure, or examples you would like to see.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include links, screenshots, or related files if helpful.
