name: Bug Report
description: 报告会影响游玩、部署或数据构建的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把复现步骤、环境和报错信息写完整，方便快速定位。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 游戏流程
        - 题库 / 数据
        - 图片 / 资源代理
        - 部署 / Docker
        - CI / 自动化
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入首页
        2. 开始新一局
        3. 输入某位马娘后点击候选
        4. 出现报错
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际表现
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: |
        - 系统：
        - 浏览器：
        - Node.js：
        - 部署方式：
        - 是否开启 Turnstile：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 截图、日志或补充信息
