name: Bug report
description: Report a reproducible problem that affects gameplay, deployment, or data integrity
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please include a clear reproduction path, environment details, and any error output you have.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay
        - Question bank / data
        - Assets / image proxy
        - Deployment / Docker
        - CI / automation
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the homepage
        2. Start a new round
        3. Enter a character name and choose a result
        4. Observe the failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Browser:
        - Node.js:
        - Deployment method:
        - Turnstile enabled:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots, logs, or additional context
