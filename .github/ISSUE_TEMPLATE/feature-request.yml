name: Feature request
description: Propose an improvement for gameplay, UI, data flow, or deployment experience
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the target users, use case, and expected impact. Proposals that affect gameplay rules, data requirements, or deployment should also account for documentation updates.

  - type: dropdown
    id: area
    attributes:
      label: Category
      options:
        - UI / interaction
        - Gameplay / rules
        - Question bank / data
        - Assets / media
        - Deployment / automation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Proposal
    validations:
      required: true

  - type: textarea
    id: player-value
    attributes:
      label: Value
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References or additional context
