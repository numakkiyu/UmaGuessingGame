name: Feature Request
description: 提交玩法、UI、题库或部署体验上的改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        新建议请尽量说明目标玩家、使用场景和影响范围。涉及玩法字段、数据规则或部署方式的改动，需要同步更新文档。

  - type: dropdown
    id: area
    attributes:
      label: 建议方向
      options:
        - UI / 交互
        - 玩法 / 判定
        - 题库 / 数据
        - 图片 / 资源
        - 部署 / 自动化
        - 其他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 你想实现什么
    validations:
      required: true

  - type: textarea
    id: player-value
    attributes:
      label: 这会给玩家或维护者带来什么帮助
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参考资料或补充说明
